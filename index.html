<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>A Little Bouquet</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Quicksand:wght@400;500;600;700&family=Caveat:wght@500;600;700&display=swap');

  :root{
    --cream: #fdf8f3;
    --blush: #f7dce0;
    --blush-deep: #eab8c2;
    --lavender: #e3d6f0;
    --sage: #b9c9a9;
    --sage-deep: #94a87f;
    --ink: #5b4a4f;
    --ink-soft: #8a7a7e;
    --gold: #e3b97f;
    --white: #fffaf6;
  }

  *{ box-sizing: border-box; }
  html,body{
    margin:0; padding:0; width:100%; min-height:100vh;
    font-family:'Quicksand', sans-serif;
    color: var(--ink);
    background: linear-gradient(160deg, var(--cream) 0%, #f9eee8 50%, var(--blush) 100%);
    overflow-x:hidden;
  }

  button{ font-family:inherit; cursor:pointer; }
  button:focus-visible, .swatch:focus-visible, .flower-card:focus-visible {
    outline: 3px solid var(--sage-deep);
    outline-offset: 2px;
  }

  @media (prefers-reduced-motion: reduce){
    *{ animation-duration: 0.01ms !important; animation-iteration-count: 1 !important; transition-duration: 0.01ms !important; }
  }

  .app{
    max-width: 980px;
    margin: 0 auto;
    padding: 28px 20px 60px;
    min-height: 100vh;
  }
  .app.full-bleed{
    max-width: none;
    padding: 0;
    min-height: 100vh;
  }

  /* ---------- Header ---------- */
  .app-header{
    text-align:center;
    margin-bottom: 18px;
  }
  .app-header .eyebrow{
    font-size: 13px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--sage-deep);
    font-weight:600;
  }
  .app-header h1{
    font-family:'Caveat', cursive;
    font-size: 52px;
    margin: 4px 0 0;
    color: var(--ink);
    font-weight:700;
  }

  .step-track{
    display:flex;
    justify-content:center;
    gap: 10px;
    margin: 18px 0 6px;
  }
  .step-dot{
    width:9px; height:9px; border-radius:50%;
    background: #e7d9d2;
    transition: background .3s ease, transform .3s ease;
  }
  .step-dot.active{ background: var(--blush-deep); transform: scale(1.3); }
  .step-dot.done{ background: var(--sage-deep); }

  .screen{
    animation: fadeSlideIn .5s ease both;
  }
  @keyframes fadeSlideIn{
    from{ opacity:0; transform: translateY(14px); }
    to{ opacity:1; transform: translateY(0); }
  }

  /* ---------- Step 1: Drag-and-drop designer ---------- */
  .intro-text{
    text-align:center;
    color: var(--ink-soft);
    max-width: 480px;
    margin: 0 auto 14px;
    font-size: 14.5px;
    line-height:1.5;
  }

  .designer{
    position: fixed;
    top: 0; left:0; right:0; bottom:0;
    display:flex;
    flex-direction:column;
    background: linear-gradient(160deg, var(--cream) 0%, #f9eee8 50%, var(--blush) 100%);
  }
  .designer-header{
    text-align:center;
    padding: 14px 16px 6px;
    flex-shrink:0;
  }
  .designer-header h1{
    font-family:'Caveat', cursive;
    font-size: 34px;
    margin: 2px 0 0;
    color: var(--ink);
  }
  .designer-header .eyebrow{
    font-size: 11.5px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--sage-deep);
    font-weight:700;
  }
  .designer-hint{
    text-align:center;
    font-size: 12.5px;
    color: var(--ink-soft);
    padding: 0 16px 8px;
    flex-shrink:0;
  }

  /* drop zone (vase area) fills remaining space */
  .drop-zone{
    flex: 1 1 auto;
    position: relative;
    overflow: hidden;
    touch-action: none;
    min-height: 380px;
  }
  .drop-zone.drag-over::before{
    content:"";
    position:absolute;
    inset: 8px;
    border: 2px dashed var(--blush-deep);
    border-radius: 24px;
    pointer-events:none;
    opacity:.6;
  }
  .drop-zone .vase-base{
    position:absolute;
    bottom: 0; left:50%;
    transform: translateX(-50%);
    width: 200px;
    z-index: 1;
    pointer-events:none;
  }
  .drop-zone .vase-base .vase-layer,
  .vase-stage .vase-base .vase-layer{
    pointer-events:none;
  }
  .drop-zone .vase-base .vase-back-layer,
  .vase-stage .vase-base .vase-back-layer{
    z-index: 1;
  }
  .drop-zone .vase-base .vase-front-layer,
  .vase-stage .vase-base .vase-front-layer{
    z-index: 3;
  }
  .empty-vase-msg{
    position:absolute;
    top: 16px; left:0; right:0;
    text-align:center;
    color: var(--ink-soft);
    font-size: 13px;
    font-style: italic;
    pointer-events:none;
    z-index: 50;
  }

  .placed-flower-d{
    position:absolute;
    transform-origin: bottom center;
    transition: left .4s cubic-bezier(.34,1.3,.64,1), bottom .4s cubic-bezier(.34,1.3,.64,1), transform .4s cubic-bezier(.34,1.3,.64,1);
  }
  .placed-flower-d.stem-layer{ z-index: 2; }
  .placed-flower-d.head-layer{ z-index: 4; }
  .placed-flower-d svg{
    width: 100%; height:100%; display:block;
    filter: drop-shadow(0 3px 4px rgba(120,90,90,0.18));
    pointer-events:none;
  }
  .placed-flower-d .flower-stem-layer,
  .placed-flower-d .flower-head-layer,
  .placed-flower .flower-stem-layer,
  .placed-flower .flower-head-layer{
    position:absolute; inset:0; width:100%; height:100%; pointer-events:none;
  }
  .placed-flower-d .flower-stem-layer svg,
  .placed-flower .flower-stem-layer svg{
    clip-path: inset(50% 0 0 0);
  }
  .placed-flower-d .flower-head-layer svg,
  .placed-flower .flower-head-layer svg{
    clip-path: inset(0 0 50% 0);
  }
  .placed-flower-d .del-x{
    position:absolute;
    top:-6px; right:-6px;
    width: 20px; height:20px;
    background: var(--white);
    border-radius:50%;
    border: none;
    font-size: 11px;
    line-height:20px;
    text-align:center;
    color: var(--ink-soft);
    box-shadow: 0 2px 6px rgba(0,0,0,0.15);
    opacity: 0;
    transition: opacity .15s ease;
    z-index: 60;
  }
  .placed-flower-d:hover .del-x,
  .placed-flower-d.recent .del-x{ opacity: 1; }

  /* bottom flower tray, horizontally scrollable */
  .flower-tray-bar{
    flex-shrink:0;
    background: var(--white);
    border-top: 1px solid rgba(190,150,150,0.18);
    box-shadow: 0 -6px 18px rgba(190,150,150,0.12);
    padding: 10px 0 calc(10px + env(safe-area-inset-bottom, 0px));
  }
  .tray-scroll{
    display:flex;
    gap: 12px;
    overflow-x: auto;
    overflow-y: visible;
    padding: 4px 14px 6px;
    -webkit-overflow-scrolling: touch;
    scrollbar-width: thin;
  }
  .tray-scroll::-webkit-scrollbar{ height: 5px; }
  .tray-scroll::-webkit-scrollbar-thumb{ background: var(--blush-deep); border-radius:4px; }

  .tray-flower-card{
    flex: 0 0 auto;
    width: 78px;
    text-align:center;
    user-select:none;
  }
  .tray-flower-card .drag-handle{
    width: 64px; height:64px;
    margin: 0 auto;
    background: var(--cream);
    border-radius: 16px;
    display:flex; align-items:center; justify-content:center;
    cursor: grab;
    touch-action: none;
    transition: transform .15s ease, box-shadow .15s ease;
    box-shadow: 0 2px 8px rgba(190,150,150,0.15);
  }
  .tray-flower-card .drag-handle:active{ cursor: grabbing; }
  .tray-flower-card .drag-handle.lifting{
    transform: scale(1.08);
    box-shadow: 0 6px 16px rgba(190,150,150,0.3);
  }
  .tray-flower-card .drag-handle svg{ width: 46px; height:46px; pointer-events:none; }
  .tray-flower-card .fname{
    font-size: 11px;
    font-weight:600;
    margin: 5px 0 4px;
    white-space: nowrap;
  }
  .tray-flower-card .swatches{
    display:flex;
    justify-content:center;
    gap: 4px;
    flex-wrap: wrap;
  }
  .tray-flower-card .swatch{
    width: 14px; height:14px;
  }
  .vase-picker-wrap{
    padding: 0 14px 10px;
  }
  .vase-picker{
    display:flex;
    justify-content:center;
    gap: 8px;
    flex-wrap:wrap;
  }
  .vase-option{
    border: 1px solid rgba(190,150,150,0.25);
    background: var(--cream);
    color: var(--ink);
    font-size: 12px;
    font-weight:700;
    padding: 7px 10px;
    border-radius: 999px;
    transition: background .2s ease, transform .15s ease, border-color .2s ease;
  }
  .vase-option:hover{ background: var(--blush); transform: translateY(-1px); }
  .vase-option.selected{
    background: linear-gradient(135deg, var(--blush-deep), var(--gold));
    color: var(--white);
    border-color: transparent;
  }

  /* the floating ghost element that follows the pointer while dragging */
  .drag-ghost{
    position: fixed;
    pointer-events: none;
    z-index: 9999;
    opacity: 0.92;
    transform: translate(-50%, -50%) scale(1.1);
    filter: drop-shadow(0 6px 10px rgba(120,90,90,0.3));
  }
  .drag-ghost svg{ width: 100%; height:100%; }

  body.dragging-flower{
    cursor: grabbing;
  }
  body.dragging-flower .tray-scroll{
    overflow-x: hidden;
  }

  .designer-footer{
    flex-shrink:0;
    display:flex;
    justify-content:center;
    align-items:center;
    gap: 12px;
    padding: 8px 16px calc(10px + env(safe-area-inset-bottom, 0px));
    background: var(--white);
    border-top: 1px solid rgba(190,150,150,0.1);
  }
  .placed-count{
    font-size: 12.5px;
    color: var(--ink-soft);
    font-weight:600;
  }

  .primary-btn{
    display:block;
    margin: 0 auto;
    background: linear-gradient(135deg, var(--blush-deep), var(--gold));
    color: var(--white);
    border:none;
    padding: 13px 34px;
    border-radius: 999px;
    font-size: 15.5px;
    font-weight:700;
    box-shadow: 0 6px 16px rgba(220,160,150,0.35);
    transition: transform .2s ease, box-shadow .2s ease, opacity .2s ease;
  }
  .primary-btn:hover:not(:disabled){ transform: translateY(-2px); box-shadow: 0 9px 20px rgba(220,160,150,0.45); }
  .primary-btn:active:not(:disabled){ transform: translateY(0) scale(0.97); }
  .primary-btn:disabled{
    opacity: 0.4;
    cursor:not-allowed;
    box-shadow:none;
  }
  .hint-text{
    text-align:center;
    font-size: 12.5px;
    color: var(--ink-soft);
    margin-top: 8px;
  }

  .secondary-btn{
    background: var(--white);
    border: 2px solid var(--blush-deep);
    color: var(--ink);
    padding: 10px 22px;
    border-radius: 999px;
    font-weight:700;
    font-size: 14px;
    transition: background .2s ease, transform .15s ease;
  }
  .secondary-btn:hover{ background: var(--blush); transform: translateY(-1px); }
  .secondary-btn:active{ transform: translateY(0) scale(0.96); }

  .ghost-btn{
    background:none;
    border:none;
    color: var(--ink-soft);
    font-size: 13.5px;
    font-weight:600;
    text-decoration: underline;
    padding: 6px;
  }
  .ghost-btn:hover{ color: var(--ink); }

  /* ---------- Step 2: Vase scene ---------- */
  .vase-stage{
    position: relative;
    width: 100%;
    max-width: 420px;
    height: 420px;
    margin: 0 auto 10px;
  }
  .vase-stage svg.vase-base{
    position:absolute;
    bottom: 0; left:50%;
    transform: translateX(-50%);
    width: 220px;
    z-index: 1;
  }
  .flower-layer{
    position:absolute;
    bottom: 150px;
    left:50%;
    width:1px; height:1px;
  }
  .placed-flower{
    position:absolute;
    transform-origin: bottom center;
    transition: left .55s cubic-bezier(.34,1.3,.64,1), bottom .55s cubic-bezier(.34,1.3,.64,1), transform .55s cubic-bezier(.34,1.3,.64,1);
  }
  .placed-flower.stem-layer{ z-index:2; }
  .placed-flower.head-layer{ z-index:4; }
  .placed-flower svg{
    width: 100%; height:100%; display:block;
    filter: drop-shadow(0 3px 4px rgba(120,90,90,0.18));
  }

  .step2-actions{
    display:flex;
    justify-content:center;
    gap: 12px;
    flex-wrap: wrap;
    margin: 14px 0 6px;
  }

  /* ---------- Step 3: Dedication card ---------- */
  .note-card{
    background: var(--white);
    max-width: 440px;
    margin: 0 auto;
    border-radius: 18px;
    padding: 26px 26px 22px;
    box-shadow: 0 10px 26px rgba(190,150,150,0.18);
    position: relative;
  }
  .note-card::before{
    content:"";
    position:absolute;
    top:0; left: 18px; right: 18px;
    height: 6px;
    background: repeating-linear-gradient(90deg, var(--blush-deep) 0 14px, transparent 14px 22px);
    border-radius: 0 0 6px 6px;
    opacity: .55;
  }
  .field-label{
    font-size: 12.5px;
    font-weight:700;
    color: var(--ink-soft);
    text-transform: uppercase;
    letter-spacing:.05em;
    margin-bottom: 5px;
    display:block;
  }
  .field-input, .field-textarea{
    width:100%;
    border: 2px solid var(--blush);
    border-radius: 12px;
    padding: 10px 12px;
    font-family:'Quicksand', sans-serif;
    font-size: 14.5px;
    color: var(--ink);
    margin-bottom: 16px;
    transition: border-color .2s ease;
    background: var(--cream);
  }
  .field-input:focus, .field-textarea:focus{
    outline:none;
    border-color: var(--blush-deep);
  }
  .field-textarea{
    min-height: 100px;
    resize: vertical;
    font-family: 'Caveat', cursive;
    font-size: 20px;
    line-height: 1.4;
  }
  .char-count{
    font-size: 11.5px;
    color: var(--ink-soft);
    text-align:right;
    margin: -12px 0 14px;
  }

  /* ---------- Step 4: Reveal ---------- */
  .reveal-screen{
    min-height: 80vh;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    position: relative;
    text-align:center;
    padding: 20px 0;
  }
  .petal-field{
    position:fixed;
    inset:0;
    pointer-events:none;
    overflow:hidden;
    z-index:0;
  }
  .petal{
    position:absolute;
    top: -5%;
    opacity: 0;
    animation: petalFall linear infinite;
  }
  @keyframes petalFall{
    0%{ opacity:0; transform: translateY(0) translateX(0) rotate(0deg); }
    8%{ opacity:.75; }
    90%{ opacity:.6; }
    100%{ opacity:0; transform: translateY(110vh) translateX(var(--drift)) rotate(340deg); }
  }

  .reveal-vase-wrap{
    opacity:0;
    transform: scale(.85);
    animation: revealPop .8s ease forwards;
    animation-delay: .1s;
    position:relative;
    z-index:2;
  }
  @keyframes revealPop{
    to{ opacity:1; transform: scale(1); }
  }

  .reveal-note{
    opacity:0;
    transform: translateY(16px);
    animation: revealSlide .7s ease forwards;
    animation-delay: 1.0s;
    max-width: 460px;
    margin: 18px auto 0;
    background: rgba(255,250,246,0.9);
    backdrop-filter: blur(2px);
    border-radius: 18px;
    padding: 22px 28px;
    box-shadow: 0 10px 30px rgba(190,150,150,0.2);
    position:relative;
    z-index:2;
  }
  @keyframes revealSlide{
    to{ opacity:1; transform: translateY(0); }
  }
  .reveal-to{
    font-size: 13px;
    color: var(--ink-soft);
    text-transform: uppercase;
    letter-spacing:.08em;
    font-weight:700;
    margin-bottom: 6px;
  }
  .reveal-message{
    font-family:'Caveat', cursive;
    font-size: 26px;
    line-height: 1.35;
    color: var(--ink);
    margin: 6px 0 14px;
    white-space: pre-wrap;
    word-break: break-word;
  }
  .reveal-from{
    font-size: 14.5px;
    color: var(--ink-soft);
    font-weight: 600;
  }
  .reveal-from span{
    font-family:'Caveat', cursive;
    font-size: 20px;
    color: var(--ink);
  }

  .sparkle{
    position:absolute;
    font-size: 16px;
    opacity:0;
    animation: twinkle 2.4s ease-in-out infinite;
    z-index:1;
    pointer-events:none;
  }
  @keyframes twinkle{
    0%, 100%{ opacity:0; transform: scale(.6) rotate(0deg); }
    50%{ opacity:.85; transform: scale(1.05) rotate(20deg); }
  }

  .restart-wrap{
    margin-top: 22px;
    position:relative;
    z-index:2;
  }

  .sr-only{
    position:absolute;
    width:1px;height:1px;
    overflow:hidden;
    clip:rect(0 0 0 0);
  }
</style>
</head>
<body>
<div id="app" class="app"></div>

<script>
(function(){

  /* ============================================================
     FLOWER DEFINITIONS — SVGs with currentColor so fill is set
     dynamically via inline style. Each flower has color options.
  ============================================================ */

  const COLORS = {
    red: '#d96c6c',
    pink: '#f0a8c0',
    white: '#fbf6ef',
    peach: '#f3b98a',
    yellow: '#f0cf6c',
    lavenderC: '#bda3da',
    blue: '#9bb9da'
  };

  const FLOWER_TYPES = [
    {
      id: 'rose', name: 'Rose', size: 'large', role: 'focal',

            <path d="M40 38 C46 36 48 30 44 26 C40 23 35 25 35 30 C35 34 39 36 42 34" fill="none" stroke="${shade(c,-16)}" stroke-width="2.4" stroke-linecap="round"/>
            <circle cx="40" cy="33" r="5" fill="${shade(c,-12)}"/>
          </g>
        </svg>`
    },
    {
      id: 'tulip', name: 'Tulip', size: 'medium', role: 'focal',
      colors: ['red','pink','white','yellow'],
      svg: (c) => `
        <svg viewBox="0 0 80 160" xmlns="http://www.w3.org/2000/svg">
          <path d="M40 58 C37 88 39 122 35 152" stroke="#5e8a4d" stroke-width="3" fill="none" stroke-linecap="round"/>
          <path d="M37 100 C28 98 22 104 19 114 C28 114 34 110 37 102 Z" fill="#6a9a57"/>
          <path d="M39 125 C47 122 53 127 56 136 C48 137 42 134 39 127 Z" fill="#5e8a4d"/>
          <path d="M40 20 C28 20 26 38 26 46 C26 56 33 60 40 60 C47 60 54 56 54 46 C54 38 52 20 40 20 Z" fill="${c}"/>
          <path d="M40 24 C34 26 32 38 33 46 C34 53 37 56 40 57 Z" fill="${shade(c,8)}" opacity="0.6"/>
          <path d="M40 24 C46 26 48 38 47 46 C46 53 43 56 40 57 Z" fill="${shade(c,-6)}" opacity="0.5"/>
        </svg>`
    },
    {
      id: 'daisy', name: 'Daisy', size: 'small', role: 'accent',
      colors: ['white','yellow','pink'],
      svg: (c) => `
        <svg viewBox="0 0 80 160" xmlns="http://www.w3.org/2000/svg">
          <path d="M40 58 C38 90 41 122 38 152" stroke="#6a9a57" stroke-width="2.5" fill="none" stroke-linecap="round"/>
          <path d="M38 105 C30 103 25 108 22 116 C30 117 35 113 38 107 Z" fill="#7aab66"/>
          <g fill="${c}">
            <ellipse cx="40" cy="24" rx="7" ry="14"/>
            <ellipse cx="40" cy="56" rx="7" ry="14"/>
            <ellipse cx="24" cy="40" rx="14" ry="7"/>
            <ellipse cx="56" cy="40" rx="14" ry="7"/>
            <ellipse cx="29" cy="29" rx="7" ry="14" transform="rotate(45 29 29)"/>
            <ellipse cx="51" cy="51" rx="7" ry="14" transform="rotate(45 51 51)"/>
            <ellipse cx="51" cy="29" rx="7" ry="14" transform="rotate(-45 51 29)"/>
            <ellipse cx="29" cy="51" rx="7" ry="14" transform="rotate(-45 29 51)"/>
          </g>
          <circle cx="40" cy="40" r="10" fill="#eec05a"/>
        </svg>`
    },
    {
      id: 'sunflower', name: 'Sunflower', size: 'large', role: 'focal',
      colors: ['yellow'],

  function shade(hex, percent){
    // lighten/darken a hex color by percent (-100..100)
    let f = parseInt(hex.slice(1),16);
    let t = percent < 0 ? 0 : 255;
    let p = Math.abs(percent)/100;
    let R = f>>16, G = (f>>8)&0x00FF, B = f&0x0000FF;
    const r = Math.round((t-R)*p)+R;
    const g = Math.round((t-G)*p)+G;
    const b = Math.round((t-B)*p)+B;
    return '#' + (0x1000000 + r*0x10000 + g*0x100 + b).toString(16).slice(1);
  }

  const COLOR_NAMES = {
    red: 'Red', pink: 'Pink', white: 'White', peach: 'Peach',
    yellow: 'Yellow', lavenderC: 'Lavender', blue: 'Blue'
  };

  /* ============================================================
     STATE
  ============================================================ */
  let state = {
    step: 1,
    selectedColors: {},       // flowerId -> current swatch color key chosen in UI
    placedFlowers: [],        // array of {flowerId, colorKey, uid, x, bottomOffset, width, height, rotation, z} — manually placed in the vase
    selectedVase: 'classic',
    to: '',
    from: '',
    message: ''
  };

  const MAX_FLOWERS = 9;
  const PLACED_FLOWER_HEIGHT = 106;
  let uidCounter = 0;

  const root = document.getElementById('app');

  function render(){
    if(state.step === 1) renderStep1();
    else if(state.step === 3) renderStep3();
    else if(state.step === 4) renderStep4();
  }

  function stepTrackHTML(current){
    // 3 visible stages now: 1 = design, 2 = dedication, 3 = reveal
    const map = {1:1, 3:2, 4:3};
    const activeIdx = map[current] || 1;
    let dots = '';
    for(let i=1;i<=3;i++){
      let cls = i === activeIdx ? 'active' : (i < activeIdx ? 'done' : '');
      dots += `<div class="step-dot ${cls}"></div>`;
    }
    return `<div class="step-track">${dots}</div>`;
  }

  /* ---------------- STEP 1: DRAG-AND-DROP DESIGNER ---------------- */
  // placedFlowers: array of {flowerId, colorKey, uid, x, y, size, rotation, z}
  // x,y are stored as pixel offsets relative to the drop-zone's center-bottom anchor point
  let dragState = null; // {flowerId, colorKey, ghostEl, fromHandleEl}

  function renderStep1(){
    FLOWER_TYPES.forEach(f => {
      if(!state.selectedColors[f.id]) state.selectedColors[f.id] = f.colors[0];
    });

    const trayCards = FLOWER_TYPES.map(f => {
      const chosenColor = state.selectedColors[f.id];
      const hex = COLORS[chosenColor] || chosenColor;
      const swatches = f.colors.map(ck => {
        const chex = COLORS[ck] || ck;
        const sel = ck === chosenColor ? 'selected' : '';
        return `<button class="swatch ${sel}" style="background:${chex}" data-flower="${f.id}" data-color="${ck}" aria-label="${COLOR_NAMES[ck]||ck} ${f.name}" title="${COLOR_NAMES[ck]||ck}"></button>`;
      }).join('');

      return `
        <div class="tray-flower-card">
          <div class="drag-handle" data-handle="${f.id}" tabindex="0" role="button" aria-label="Drag ${f.name} into the vase">${f.svg(hex)}</div>
          <div class="fname">${f.name}</div>
          <div class="swatches">${swatches}</div>
        </div>`;
    }).join('');

    const placedHTML = state.placedFlowers.map(placedFlowerDesignerHTML).join('');
    const count = state.placedFlowers.length;

    root.className = 'full-bleed';
    root.innerHTML = `
      <div class="designer">
        <div class="designer-header">
          <div class="eyebrow">Make something special</div>
          <h1>Design Your Bouquet</h1>
        </div>
        <p class="designer-hint">Drag a flower from the tray below and drop it into the vase 🌸</p>

        <div class="drop-zone" id="dropZone">
          ${count === 0 ? `<div class="empty-vase-msg">Your vase is waiting — drag a flower down here</div>` : ''}
          ${placedHTML}
          ${vaseSVG()}
        </div>

        <div class="designer-footer">
          <span class="placed-count">${count} flower${count===1?'':'s'} placed${count >= MAX_FLOWERS ? ' — vase is full 💐' : ''}</span>
        </div>

        <div class="flower-tray-bar">
          <div class="vase-picker-wrap">
            <div class="vase-picker" role="group" aria-label="Choose a vase">
              ${VASES.map(vase => `<button class="vase-option ${state.selectedVase === vase.id ? 'selected' : ''}" data-vase="${vase.id}" type="button">${vase.name}</button>`).join('')}
            </div>
          </div>
          <div class="tray-scroll" id="trayScroll">${trayCards}</div>
          <div style="display:flex; justify-content:center; margin-top:8px;">
            <button class="primary-btn" id="toStep3b" style="padding:10px 26px; font-size:14px;" ${count === 0 ? 'disabled' : ''}>Looks Lovely — Continue 💌</button>
          </div>
        </div>
      </div>
    `;

    wireDesignerDrag();

    const nextBtn = document.getElementById('toStep3b');
    if(nextBtn){
      nextBtn.addEventListener('click', () => {
        if(state.placedFlowers.length === 0) return;
        snapshotArrangementForPreview();
        state.step = 3;
        render();
      });
    }
  }

  function getSelectedVase(){
    return VASES.find(v => v.id === state.selectedVase) || VASES[0];
  }

  function placedFlowerDesignerHTML(item){
    const f = FLOWER_TYPES.find(x => x.id === item.flowerId);
    const hex = COLORS[item.colorKey] || item.colorKey;
    const svgMarkup = f.svg(hex);
    return `<div class="placed-flower-d ${item.z >= 20 ? 'head-layer' : 'stem-layer'}" data-uid="${item.uid}" style="left:${item.x}px; bottom:${item.bottomOffset}px; width:${item.width}px; height:${item.height}px; transform: translateX(-50%) rotate(${item.rotation}deg); z-index:${item.z};">
      <div class="flower-stem-layer">${svgMarkup}</div>
      <div class="flower-head-layer">${svgMarkup}</div>
      <button class="del-x" data-del="${item.uid}" aria-label="Remove this flower" style="top:-8px;">✕</button>
    </div>`;
  }

  function rand(min,max){ return Math.random()*(max-min)+min; }

  function wireDesignerDrag(){
    // delete buttons on already-placed flowers
    root.querySelectorAll('[data-del]').forEach(btn => {
      btn.addEventListener('pointerdown', (e) => e.stopPropagation());
      btn.addEventListener('click', (e) => {
        e.stopPropagation();
        const uid = btn.getAttribute('data-del');
        const flower = state.placedFlowers.find(p => p.uid === uid);
        if(flower) {
          state.placedFlowers = state.placedFlowers.filter(p => p.uid !== uid);
          renderStep1();
        }
      });
    });

    // start drag from tray handles
    root.querySelectorAll('.drag-handle').forEach(handle => {
      handle.addEventListener('pointerdown', (e) => {
        if(state.placedFlowers.length >= MAX_FLOWERS) return;
        e.preventDefault();
        const flowerId = handle.getAttribute('data-handle');
        const colorKey = state.selectedColors[flowerId];
        startDrag(flowerId, colorKey, e.clientX, e.clientY, handle);
      });
      // keyboard fallback: Enter/Space drops flower into the best open slot
      handle.addEventListener('keydown', (e) => {
        if(e.key === 'Enter' || e.key === ' '){
          e.preventDefault();
          if(state.placedFlowers.length >= MAX_FLOWERS) return;
          const flowerId = handle.getAttribute('data-handle');
          const colorKey = state.selectedColors[flowerId];
          dropFlowerAtCenter(flowerId, colorKey);
        }
      });
    });

    // swatch clicks inside tray
    root.querySelectorAll('.swatch').forEach(btn => {
      btn.addEventListener('click', (e) => {
        e.stopPropagation();
        const flowerId = btn.getAttribute('data-flower');
        const colorKey = btn.getAttribute('data-color');
        state.selectedColors[flowerId] = colorKey;
        renderStep1();
      });
    });

    root.querySelectorAll('.vase-option').forEach(btn => {
      btn.addEventListener('click', () => {
        state.selectedVase = btn.getAttribute('data-vase');
        renderStep1();
      });
    });
  }

  function getPlacementForFlower(index, dropZoneRect){
    const vase = getSelectedVase();
    const openingX = dropZoneRect.width / 2 + vase.openingPoint.x;
    const openingY = dropZoneRect.height - vase.openingPoint.y;
    const spread = 12 + Math.min(28, index * 8);
    const angle = (-0.28 + index * 0.08) + ((index % 2) ? 0.06 : -0.06);
    const x = openingX + Math.cos(angle) * spread;
    const bottomOffset = openingY - 18 - index * 7;
    const rotation = (-10 + index * 3) + ((index % 2) ? 5 : -5);
    const scale = PLACED_FLOWER_HEIGHT / 160;
    return {
      x: Math.round(x),
      bottomOffset: Math.round(bottomOffset),
      rotation: Math.round(rotation),
      width: Math.round(80 * scale),
      height: PLACED_FLOWER_HEIGHT,
      z: 18 + (index < 4 ? 2 : 0) + (index % 2 ? 1 : 0)
    };
  }

  function placeFlowerInSlot(flowerId, colorKey, dropZoneRect, index){
    const placement = getPlacementForFlower(index, dropZoneRect);
    uidCounter++;
    state.placedFlowers.push({
      flowerId, colorKey, uid: 'p'+uidCounter,
      x: placement.x,
      bottomOffset: placement.bottomOffset,
      width: placement.width,
      height: placement.height,
      rotation: placement.rotation,
      z: placement.z
    });
  }

  function dropFlowerAtCenter(flowerId, colorKey){
    const dropZone = document.getElementById('dropZone');
    if(!dropZone) return;
    const rect = dropZone.getBoundingClientRect();
    placeFlowerInSlot(flowerId, colorKey, rect, state.placedFlowers.length);
    renderStep1();
  }

  function startDrag(flowerId, colorKey, startX, startY, handleEl){
    const hex = COLORS[colorKey] || colorKey;
    const scale = PLACED_FLOWER_HEIGHT / 160;
    const width = Math.round(80 * scale);
    const height = PLACED_FLOWER_HEIGHT;

    const ghost = document.createElement('div');
    ghost.className = 'drag-ghost';
    ghost.style.width = width + 'px';
    ghost.style.height = height + 'px';
    ghost.style.left = startX + 'px';
    ghost.style.top = startY + 'px';
    ghost.innerHTML = FLOWER_TYPES.find(x => x.id === flowerId).svg(hex);
    document.body.appendChild(ghost);
    document.body.classList.add('dragging-flower');
    handleEl.classList.add('lifting');

    dragState = { flowerId, colorKey, ghostEl: ghost, handleEl };

    function onMove(e){
      if(!dragState) return;
      const x = e.clientX !== undefined ? e.clientX : (e.touches && e.touches[0].clientX);
      const y = e.clientY !== undefined ? e.clientY : (e.touches && e.touches[0].clientY);
      if(x === undefined) return;
      dragState.ghostEl.style.left = x + 'px';
      dragState.ghostEl.style.top = y + 'px';

      const dropZone = document.getElementById('dropZone');
      if(dropZone){
        const rect = dropZone.getBoundingClientRect();
        const inside = x >= rect.left && x <= rect.right && y >= rect.top && y <= rect.bottom;
        dropZone.classList.toggle('drag-over', inside);
      }
    }

    function onUp(e){
      if(!dragState) return cleanup();
      const x = e.clientX !== undefined ? e.clientX : (e.changedTouches && e.changedTouches[0].clientX);
      const y = e.clientY !== undefined ? e.clientY : (e.changedTouches && e.changedTouches[0].clientY);

      const dropZone = document.getElementById('dropZone');
      if(dropZone && x !== undefined && y !== undefined){
        const rect = dropZone.getBoundingClientRect();
        const inside = x >= rect.left && x <= rect.right && y >= rect.top && y <= rect.bottom;
        if(inside && state.placedFlowers.length < MAX_FLOWERS){
          placeFlowerInSlot(dragState.flowerId, dragState.colorKey, rect, state.placedFlowers.length);
        }
      }
      cleanup();
      renderStep1();
    }

    function cleanup(){
      document.removeEventListener('pointermove', onMove);
      document.removeEventListener('pointerup', onUp);
      document.removeEventListener('pointercancel', onUp);
      if(dragState && dragState.ghostEl && dragState.ghostEl.parentNode){
        dragState.ghostEl.parentNode.removeChild(dragState.ghostEl);
      }
      document.body.classList.remove('dragging-flower');
      dragState = null;
    }

    document.addEventListener('pointermove', onMove);
    document.addEventListener('pointerup', onUp);
    document.addEventListener('pointercancel', onUp);
  }

  /* ---------------- STATIC VASE PREVIEW (used in steps 3 & 4) ---------------- */
  function vaseSVG(){
    const vase = getSelectedVase();
    return `
    <svg class="vase-base" viewBox="0 0 220 200" xmlns="http://www.w3.org/2000/svg">
      ${vase.svg}
    </svg>`;
  }

  // Renders a placed flower at a normalized position for the read-only preview stage
  // (steps 3 & 4), scaling the original drop-zone coordinates into a fixed-size stage.
  // Anchored at the stem base (left+bottom), matching how flowers are positioned live
  // in the designer, so the bouquet looks identical here as it did when she built it.
  function previewFlowerHTML(item, stageWidth, stageHeight){
    const f = FLOWER_TYPES.find(x => x.id === item.flowerId);
    const hex = COLORS[item.colorKey] || item.colorKey;
    const svgMarkup = f.svg(hex);
    const left = `${Math.round(item.normX * stageWidth)}px`;
    const bottom = `${Math.round(item.normBottom * stageHeight)}px`;
    return `<div class="placed-flower ${item.z >= 20 ? 'head-layer' : 'stem-layer'}" style="left:${left}; bottom:${bottom}; width:${item.width}px; height:${item.height}px; transform: translateX(-50%) rotate(${item.rotation}deg); z-index:${item.z};">
      <div class="flower-stem-layer">${svgMarkup}</div>
      <div class="flower-head-layer">${svgMarkup}</div>
    </div>`;
  }

  function ribbonSVG(){
    return `
    <svg viewBox="0 0 100 40" style="position:absolute; left:50%; transform:translateX(-50%); bottom:150px; width:90px; z-index:25;" xmlns="http://www.w3.org/2000/svg">
      <path d="M20 10 L50 22 L20 32 Z" fill="var(--gold)"/>
      <path d="M80 10 L50 22 L80 32 Z" fill="var(--gold)"/>
      <circle cx="50" cy="20" r="8" fill="${shade('#e3b97f',-10)}"/>
    </svg>`;
  }

  // captures the current drop-zone's flower positions as normalized (0-1) coordinates
  // so the same arrangement can be redrawn at a different size in steps 3 & 4
  function snapshotArrangementForPreview(){
    const dropZone = document.getElementById('dropZone');
    let w = 320, h = 380;
    if(dropZone){
      const rect = dropZone.getBoundingClientRect();
      if(rect.width > 0) w = rect.width;
      if(rect.height > 0) h = rect.height;
    }
    state.previewArrangement = state.placedFlowers.map(item => ({
      ...item,
      normX: item.x / w,
      normBottom: item.bottomOffset / h
    }));
  }

  /* ---------------- STEP 3: DEDICATION ---------------- */
  function renderStep3(){
    const maxChars = 300;
    root.className = '';
    root.innerHTML = `
      <div class="screen">
        <div class="app-header">
          <div class="eyebrow">Almost there</div>
          <h1>Write a Dedication</h1>
        </div>
        ${stepTrackHTML(3)}
        <p class="intro-text">Add a little note to go with your bouquet.</p>

        <div class="note-card">
          <label class="field-label" for="toInput">To</label>
          <input class="field-input" id="toInput" type="text" placeholder="Who is this for?" maxlength="40" value="${escapeHTML(state.to)}" />

          <label class="field-label" for="fromInput">From</label>
          <input class="field-input" id="fromInput" type="text" placeholder="Who's it from?" maxlength="40" value="${escapeHTML(state.from)}" />

          <label class="field-label" for="msgInput">Your message</label>
          <textarea class="field-textarea" id="msgInput" placeholder="Write something from the heart..." maxlength="${maxChars}">${escapeHTML(state.message)}</textarea>
          <div class="char-count"><span id="charCount">${state.message.length}</span> / ${maxChars}</div>
        </div>

        <button class="primary-btn" id="toStep4" style="margin-top:6px;">Reveal My Bouquet 🌷</button>
        <div style="text-align:center; margin-top:10px;">
          <button class="ghost-btn" id="backTo1from3">← Back to designing</button>
        </div>
      </div>
    `;

    const toInput = document.getElementById('toInput');
    const fromInput = document.getElementById('fromInput');
    const msgInput = document.getElementById('msgInput');
    const charCount = document.getElementById('charCount');

    toInput.addEventListener('input', () => state.to = toInput.value);
    fromInput.addEventListener('input', () => state.from = fromInput.value);
    msgInput.addEventListener('input', () => {
      state.message = msgInput.value;
      charCount.textContent = msgInput.value.length;
    });

    document.getElementById('toStep4').addEventListener('click', () => { state.step = 4; render(); });
    document.getElementById('backTo1from3').addEventListener('click', () => { state.step = 1; render(); });
  }

  function escapeHTML(str){
    return (str||'').replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
  }

  /* ---------------- STEP 4: REVEAL ---------------- */
  function renderStep4(){
    const STAGE_W = 420, STAGE_H = 420;
    const arrangement = state.previewArrangement && state.previewArrangement.length
      ? state.previewArrangement
      : state.placedFlowers.map(item => ({...item, normX: 0.5, normY: 0.6}));
    const flowersHTML = arrangement.map(item => previewFlowerHTML(item, STAGE_W, STAGE_H)).join('');

    const petalColors = ['#f0a8c0','#f7dce0','#eab8c2','#e3d6f0'];
    let petals = '';
    for(let i=0;i<14;i++){
      const left = rand(2,96).toFixed(1);
      const dur = rand(9,16).toFixed(1);
      const delay = rand(0,10).toFixed(1);
      const drift = rand(-60,60).toFixed(0);
      const size = rand(8,16).toFixed(0);
      const color = petalColors[i % petalColors.length];
      petals += `<div class="petal" style="left:${left}%; width:${size}px; height:${size}px; background:${color}; border-radius: 0 50% 50% 50%; animation-duration:${dur}s; animation-delay:${delay}s; --drift:${drift}px;"></div>`;
    }

    const sparkles = [
      {top:'18%', left:'30%', delay:'0s'},
      {top:'25%', left:'68%', delay:'.8s'},
      {top:'40%', left:'20%', delay:'1.6s'},
      {top:'15%', left:'52%', delay:'2.2s'}
    ].map(s => `<div class="sparkle" style="top:${s.top}; left:${s.left}; animation-delay:${s.delay};">✨</div>`).join('');

    const toName = state.to.trim() || 'You';
    const fromName = state.from.trim() || 'Someone who cares';
    const message = state.message.trim() || 'A little bouquet, made just for you.';

    root.className = '';
    root.innerHTML = `
      <div class="petal-field">${petals}</div>
      <div class="reveal-screen">
        <div class="reveal-vase-wrap">
          <div class="vase-stage" style="position:relative;">
            ${sparkles}
            ${ribbonSVG()}
            ${flowersHTML}
            ${vaseSVG()}
          </div>
        </div>

        <div class="reveal-note">
          <div class="reveal-to">For ${escapeHTML(toName)}</div>
          <div class="reveal-message">${escapeHTML(message)}</div>
          <div class="reveal-from">With love, <span>${escapeHTML(fromName)}</span></div>
        </div>

        <div class="restart-wrap">
          <button class="secondary-btn" id="restartBtn">Make Another Bouquet 💐</button>
        </div>
      </div>
    `;

    document.getElementById('restartBtn').addEventListener('click', () => {
      state = { step:1, selectedColors:{}, placedFlowers:[], previewArrangement:[], selectedVase:'classic', to:'', from:'', message:'' };
      render();
    });
  }

  render();
})();
</script>
</body>
</html>
